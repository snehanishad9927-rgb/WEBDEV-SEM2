<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('https://images.unsplash.com/photo-1501973801540-537f08ccae7b') no-repeat center center/cover;
}

.container{
    width:350px;
    padding:30px;
    text-align:center;
    border-radius:20px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    color:white;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    outline:none;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#2196F3,#673AB7);
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:20px;
}

.temp{
    font-size:40px;
    font-weight:bold;
    color:#FFD54F;
}

.condition{
    font-size:22px;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter City Name">

    <button onclick="getWeather()">Check Weather</button>

    <div id="result"></div>
</div>

<script>
function getWeather(){

    let city = document.getElementById("city").value;

    if(city === ""){
        alert("Please enter a city name");
        return;
    }

    let temp = Math.floor(Math.random()*15)+20;

    let conditions = [
        "Sunny",
        "Cloudy",
        "Rainy",
        "Windy",
        "Stormy"
    ];

    let weather =
    conditions[Math.floor(Math.random()*conditions.length)];

    document.getElementById("result").innerHTML =
    `
    <h2>${city}</h2>
    <div class="temp">${temp}°C</div>
    <div class="condition">${weather}</div>
    `;
}
</script>

</body>
</html>
